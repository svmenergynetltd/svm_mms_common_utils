[project]
name = "svm-mms-common-utils"
version = "0.2.3"
description = "Common utilities for SVM MMS applications"
readme = "README.md"
authors = [
    { name = "Konstantinos Andreou", email = "konstantinos.a@svmenergy.net" },
]
requires-python = ">=3.10"
dependencies = ["pandas>=2.3.3", "pytz>=2025.1"]

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = ["pyrefly>=1.3.2", "pytest>=9.1.1", "ruff>=0.16.9"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
ignore = ["DTZ", "BLE"]

[tool.pyrefly]
project-includes = ["**/*.py*", "**/*.ipynb"]
preset = "default"
